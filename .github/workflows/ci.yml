name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests and verify counts
        shell: bash
        run: |
          npm test -- --allowOnly=false --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/test-results.json"
          node --input-type=module - "$RUNNER_TEMP/test-results.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const { numTotalTests: total, numPassedTests: passed, numFailedTests: failed,
            numPendingTests: skipped, numTodoTests: todo } = results;
          console.log(`Tests: total=${total} passed=${passed} failed=${failed} skipped=${skipped} todo=${todo}`);
          if (![total, passed, failed, skipped, todo].every(Number.isInteger)
            || total <= 0 || passed <= 0 || failed !== 0 || skipped !== 0 || todo !== 0) {
            process.exit(1);
          }
          JS
