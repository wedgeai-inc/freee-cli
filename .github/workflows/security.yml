name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gitleaks の GitHub Action は organization の repo ではライセンスキーが必要なため、
      # 公式の CLI を版とチェックサムで固定して直接実行する。
      # 更新時は https://github.com/gitleaks/gitleaks/releases の checksums.txt から取る。
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commit history; full clone required
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Run gitleaks
        run: |
          # git repo でない場所では gitleaks が exit 0 で "no leaks found" になり、検査が空回りする。
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "gitleaks: refusing to scan because this is not a git repository" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
